<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyScribe — Paper-style MCQ Quiz</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- Tailwind -->
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style type="text/tailwindcss">
      @layer base {
        html {
          font-family: "Inter", system-ui, sans-serif;
        }
      }

      @layer components {
        .chip.active {
          @apply bg-blue-600 text-white border-blue-600;
        }

        .option.selected {
          @apply border-blue-500 bg-blue-50 dark:bg-gray-700 ring-2 ring-blue-300;
        }

        .option.selected .radio {
          @apply bg-blue-600 text-white;
        }
      }
    </style>
  </head>

  <body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white">
    <main class="flex justify-center items-center min-h-screen p-4">

      <!-- ================= START ================= -->
      <section id="start-section" class="w-full max-w-4xl bg-white dark:bg-gray-800 p-8 rounded-xl shadow">

        <h1 class="text-3xl font-bold text-blue-600">StudyScribe</h1>
        <p class="text-gray-500 mt-2">Paper-style quiz (Lectures 16–23)</p>

        <div class="mt-6">
          <h3 class="font-semibold mb-2">Choose Sections</h3>

          <div class="flex gap-3 flex-wrap">

            <button class="chip active border px-4 py-2 rounded" data-sec="A">
              Section A <br /><small>10 Q • 10 marks</small>
            </button>

            <button class="chip active border px-4 py-2 rounded" data-sec="B">
              Section B <br /><small>15 Q • 30 marks</small>
            </button>

            <button class="chip active border px-4 py-2 rounded" data-sec="C">
              Section C <br /><small>10 Q • 30 marks</small>
            </button>

          </div>
        </div>

        <button id="start-btn" class="mt-6 bg-blue-600 text-white px-6 py-2 rounded">
          Start Paper
        </button>

        <p class="text-xs text-gray-400 mt-4">
          Pools: A (1–29) • B (51–80) • C (101–122)
        </p>

      </section>

      <!-- ================= QUIZ ================= -->
      <section id="section-page" class="w-full max-w-4xl hidden">

        <div class="flex justify-between mb-4">
          <h2 id="section-title"></h2>
          <span id="section-progress"></span>
        </div>

        <div id="section-questions" class="space-y-4"></div>

        <div class="flex justify-between mt-6">
          <button id="prev-section-btn">Prev</button>
          <button id="next-section-btn">Next</button>
          <button id="submit-btn" hidden>Submit</button>
        </div>

      </section>

      <!-- ================= RESULTS ================= -->
      <section id="results-section" class="w-full max-w-4xl hidden">

        <h2 class="text-xl font-bold">Result</h2>

        <p id="score-percent" class="text-2xl mt-2"></p>

        <div id="section-breakdown" class="mt-4"></div>

        <div id="wrong-items" class="mt-6"></div>

        <div class="flex gap-4 mt-6">
          <button id="retake-btn">Retake</button>
          <button id="go-start-btn">Home</button>
        </div>

      </section>

    </main>

    <script src="app.js"></script>
  </body>
</html>
